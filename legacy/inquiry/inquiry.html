<!DOCTYPE html>
<html lang="en" data-require-auth>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Inquiry - Mariam Lobren</title>
    <link rel="icon" href="../assets/images/favicon.jpg" type="image/x-icon">
    <link rel="stylesheet" href="inquiry.css">
    <link rel="stylesheet" href="../shared/css/splash.css">
    <link rel="stylesheet" href="../shared/css/session.css">
    <link rel="stylesheet" href="../shared/css/chatbot.css">
    <script src="../shared/js/splash.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../shared/js/supabase.js"></script>
    <script src="../shared/js/session.js"></script>
    <script src="../shared/js/chatbot.js" defer></script>
</head>
<body>
    <!-- CLIENT APP TOPBAR (PAGE 12) -->
    <header class="app-topbar">
        <div class="topbar-left">
            <button class="menu-toggle-btn" type="button" aria-label="Toggle menu" onclick="location.href='../index.html'">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <a class="app-brand" href="../index.html">
                <img src="../assets/images/logo.png" alt="ML Logo" class="brand-logo" onerror="this.style.display='none'">
                <span>
                    <strong>Mariam Lobren</strong>
                    <small>REAL ESTATE AGENT</small>
                </span>
            </a>
        </div>

        <div class="topbar-search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" placeholder="Search properties, location, or keywords...">
        </div>

        <div class="topbar-right">
            <button class="notif-btn" type="button" aria-label="Notifications">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            </button>

            <div class="user-profile-badge">
                <div class="avatar-circle">MS</div>
                <div class="user-meta">
                    <strong>Maria Santos</strong>
                    <small>Client</small>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN INQUIRY FORM (PAGE 12) -->
    <main class="inquiry-page-container">
        <h1 class="page-heading">Submit Inquiry</h1>

        <form class="inquiry-form-card" id="inquiryForm" onsubmit="event.preventDefault(); submitInquiry();">
            <!-- PROPERTY INFORMATION CARD -->
            <div class="form-section">
                <h3 class="section-title">Property Information</h3>

                <div class="property-summary-box">
                    <img src="../assets/images/property1.jpg" alt="Residential Lot" class="summary-thumb">
                    <div class="summary-details">
                        <h2>Residential Lot</h2>
                        <p class="summary-loc">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                            Manuyo, Las Piñas City
                        </p>
                        <div class="summary-specs">
                            <span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg> 200 sqm <small>Lot Area</small></span>
                            <span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg> Residential Lot <small>Property Type</small></span>
                            <span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg> Dasmariñas <small>Location</small></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- YOUR INFORMATION (AUTOMATICALLY DETECTED) -->
            <div class="form-section">
                <h3 class="section-title">Your Information <span class="detected-tag">(Automatically detected from your account)</span></h3>

                <div class="user-info-row">
                    <div class="input-field">
                        <label for="clientName">Name</label>
                        <input type="text" id="clientName" value="Pedro Penduko" required>
                    </div>
                    <div class="input-field">
                        <label for="clientEmail">Email</label>
                        <input type="email" id="clientEmail" value="pedropenduko@gmail.com" required>
                    </div>
                    <div class="input-field">
                        <label for="clientPhone">Phone</label>
                        <input type="tel" id="clientPhone" value="+(63) 1234 567 890" required>
                    </div>
                </div>
            </div>

            <!-- INQUIRY DETAILS -->
            <div class="form-section">
                <h3 class="section-title">Inquiry Details</h3>
                <div class="textarea-field">
                    <label for="inquiryMessage">Message*</label>
                    <textarea id="inquiryMessage" rows="5" required>I'm interested and would like to know more about this property. Are there any available units and what are the payment terms?</textarea>
                </div>
            </div>

            <!-- ACTION BUTTONS -->
            <div class="form-actions-row">
                <button type="button" class="cancel-btn" onclick="location.href='../properties/properties.html'">cancel</button>
                <button type="submit" class="submit-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    <span>Submit Inquiry</span>
                </button>
            </div>
        </form>
    </main>

    <script src="inquiry.js"></script>
</body>
</html>
